<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>יזכור — לוח יארצייט</title>
  <meta name="description" content="Daily yahrzeit list for Israel's fallen soldiers, security personnel and civilian victims of terror.">
  <meta name="theme-color" content="#f7f5f0">
  <script>try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch {}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="יזכור">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Noto+Serif+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css?v=15">
  <script type="importmap">
    {
      "imports": {
        "@hebcal/hdate": "https://cdn.jsdelivr.net/npm/@hebcal/hdate@0.22.8/+esm",
        "./src/i18n.js": "./src/i18n.js?v=15",
        "./src/periods.js": "./src/periods.js?v=15",
        "./src/yahrzeit.js": "./src/yahrzeit.js?v=15"
      }
    }
  </script>
  <!-- ?v= makes a new page load matching code and data instead of cached old files; bump with npm run bump. -->
  <meta name="app-version" content="15">
  <script type="module" src="src/app.js?v=15"></script>
</head>
<body>
  <div class="app">
    <header class="appbar">
      <button id="theme" class="icon-btn" type="button">
        <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
      <button id="lang" class="pill-btn" type="button"></button>
    </header>

    <main>
      <!-- Today -->
      <section id="view-today" class="view">
        <div class="hero" id="hero">
          <button id="prev" class="hero-arrow" type="button"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button id="date-btn" class="hero-date" type="button">
            <span id="hebrew-date" class="hebrew-date"></span>
            <span id="greg-date" class="greg-date"></span>
            <span id="count" class="count-line" aria-live="polite"></span>
          </button>
          <button id="next" class="hero-arrow" type="button"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
          <input id="date-input" class="visually-hidden" type="date" tabindex="-1" aria-hidden="true">
          <div class="hero-row">
            <label class="switch">
              <input id="after-sunset" type="checkbox" role="switch">
              <span class="track"><span class="thumb"></span></span>
              <span class="switch-label"><svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 1 0 9 9 9 9 0 0 1-9-9z"/></svg><span data-t="afterSunset"></span></span>
            </label>
            <button id="today-btn" class="chip-btn" type="button" data-t="backToToday" hidden></button>
          </div>
          <p id="demo" class="demo" hidden><span data-t="demo"></span></p>
        </div>

        <div class="strip-wrap"><div id="strip" class="strip" role="tablist"></div></div>

        <div class="segmented" data-filters role="group">
          <button type="button" data-cat="all" data-t="all"></button>
          <button type="button" data-cat="soldier" data-t="soldierShort"></button>
          <button type="button" data-cat="terror" data-t="terrorShort"></button>
        </div>
        <div id="today-periods" class="chips" role="group" hidden></div>

        <div id="install-banner" class="install-banner" hidden>
          <img src="icon-192.png" alt="" width="40" height="40">
          <div class="install-text">
            <strong data-t="installTitle"></strong>
            <span id="install-hint"></span>
          </div>
          <button id="install-go" class="chip-btn" type="button" data-t="installGo" hidden></button>
          <button id="install-close" class="install-close" type="button">✕</button>
        </div>

        <div id="list" class="list"></div>
      </section>

      <!-- Search -->
      <section id="view-search" class="view" hidden>
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" autocomplete="off" enterkeyhint="search">
        </div>
        <div class="segmented" data-filters role="group">
          <button type="button" data-cat="all" data-t="all"></button>
          <button type="button" data-cat="soldier" data-t="soldierShort"></button>
          <button type="button" data-cat="terror" data-t="terrorShort"></button>
        </div>
        <div id="search-periods" class="chips" role="group" hidden></div>
        <button id="search-year" class="chip year-chip" type="button" hidden></button>
        <h2 id="search-count" class="section-title"></h2>
        <div id="results" class="list"></div>
      </section>

      <!-- Timeline -->
      <section id="view-timeline" class="view" hidden>
        <div class="tl-hero">
          <p id="tl-total" class="tl-total"></p>
          <p class="muted" data-t="tlSubtitle"></p>
        </div>
        <div class="segmented" data-filters role="group">
          <button type="button" data-cat="all" data-t="all"></button>
          <button type="button" data-cat="soldier" data-t="soldierShort"></button>
          <button type="button" data-cat="terror" data-t="terrorShort"></button>
        </div>
        <div id="tl-periods" class="chips" role="group"></div>
        <div class="tl-card">
          <div id="tl-legend" class="tl-legend"></div>
          <div class="tl-chart-wrap">
            <div id="tl-axis" class="tl-axis" aria-hidden="true"></div>
            <div id="tl-scroll" class="tl-scroll"><div id="tl-chart" dir="ltr"></div></div>
          </div>
          <div id="tl-tip" class="tl-tip" hidden></div>
          <button id="tl-table-btn" class="bio-more" type="button" data-t="showTable"></button>
          <div id="tl-table" class="tl-table" hidden></div>
        </div>
      </section>

      <!-- About -->
      <section id="view-about" class="view" hidden>
        <div class="about-card">
          <svg class="mark" width="52" height="52" aria-hidden="true" viewBox="0 0 512 512"><rect width="512" height="512" rx="114" fill="#0038b8"/><g transform="translate(256 258) scale(1.4) translate(-256 -217)"><path d="M262 96C258 146 330 186 330 262C330 306 297 338 256 338C215 338 182 306 182 264C182 226 204 202 226 182C226 206 236 222 250 228C240 180 246 132 262 96Z" fill="#f7f5f0"/><path d="M256 334C232 334 216 316 216 296C216 272 236 258 256 232C276 258 296 272 296 296C296 316 280 334 256 334Z" fill="#e9b54a"/></g></svg>
          <h2 data-t="aboutTitle"></h2>
          <p data-t="aboutBody"></p>
          <p class="muted" data-t="aboutCalc"></p>
          <p class="muted" data-t="aboutEnglish"></p>
        </div>
        <div class="setting-card">
          <h3 data-t="themeTitle"></h3>
          <div class="segmented two" data-theme-opt role="group">
            <button type="button" data-theme-val="dark" data-t="themeDark"></button>
            <button type="button" data-theme-val="light" data-t="themeLight"></button>
          </div>
        </div>
        <div class="setting-card">
          <h3 data-t="adarTitle"></h3>
          <p class="muted" data-t="adarHint"></p>
          <div class="segmented two" data-adar role="group">
            <button type="button" data-adar="I" data-t="adarI"></button>
            <button type="button" data-adar="II" data-t="adarII"></button>
          </div>
        </div>
        <div class="settings">
          <button id="lang-row" class="row" type="button">
            <span>🌐</span><span id="lang-row-label" data-t="langLabel"></span><span class="chev"></span>
          </button>
          <button id="install" class="row" type="button" hidden>
            <span>📲</span><span data-t="install"></span><span class="chev"></span>
          </button>
          <a class="row" href="https://www.izkor.gov.il" target="_blank" rel="noopener">
            <span>🕯️</span><span>izkor.gov.il — <span data-t="soldier"></span></span><span class="chev"></span>
          </a>
          <a class="row" href="https://laad.btl.gov.il" target="_blank" rel="noopener">
            <span>🕯️</span><span>laad.btl.gov.il — <span data-t="terror"></span></span><span class="chev"></span>
          </a>
        </div>
        <p class="footer-note" data-t="footer"></p>
      </section>
    </main>

    <nav class="tabbar">
      <button type="button" data-view="today"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span data-t="tabToday"></span></button>
      <button type="button" data-view="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span data-t="tabSearch"></span></button>
      <button type="button" data-view="timeline"><svg viewBox="0 0 24 24"><path d="M4 20h16M7 16v-5M11 16V7M15 16v-7M19 16V5"/></svg><span data-t="tabTimeline"></span></button>
      <button type="button" data-view="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg><span data-t="tabAbout"></span></button>
    </nav>
  </div>

  <dialog id="sheet" class="sheet">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div id="sheet-body"></div>
  </dialog>

  <dialog id="calendar" class="sheet calendar">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="cal-head">
      <button id="cal-prev" class="hero-arrow" type="button"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="cal-titles"><h2 id="cal-title"></h2><p id="cal-greg"></p></div>
      <button id="cal-next" class="hero-arrow" type="button"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div id="cal-grid" class="cal-grid"></div>
    <div class="cal-foot">
      <button id="cal-today" class="chip-btn" type="button" data-t="today"></button>
      <label class="cal-jump"><span data-t="gregJump"></span><input id="cal-date" type="date"></label>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
</body>
</html>
